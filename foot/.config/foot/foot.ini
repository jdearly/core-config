# Foot configuration format and all available options:
# https://man.archlinux.org/man/foot.ini.5.en

[main]
# Berkeley Mono is a separately licensed local font and is not distributed by
# this repository. Foot resolves it through fontconfig.
# https://man.archlinux.org/man/fonts-conf.5.en
font=Berkeley Mono:size=14

# Resolve Zsh through each host's PATH. This also gives SteamOS Foot sessions
# Zsh without modifying SteamOS's immutable login-shell configuration.
# https://man.archlinux.org/man/foot.ini.5.en#SECTION:_main
shell=zsh

# Keep the selected Neovim palette in the dotfiles repository because absolute
# distro theme paths differ between Fedora, Arch, NixOS, and SteamOS.
include=~/.config/foot/themes/nvim

[bell]
# Disable the system bell while retaining Foot's other bell behavior.
system=false
