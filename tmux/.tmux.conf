# tmux options, commands, formats, and key tables:
# https://man.openbsd.org/tmux

# Replace the default C-b prefix with C-Space.
set -g prefix C-Space
unbind C-b

# Number windows and panes from one for direct keyboard selection.
set -g base-index 1
setw -g pane-base-index 1

# Enable mouse selection and use vi keys in copy mode.
set -g mouse on
set-window-option -g mode-keys vi

# Move between panes without entering the prefix key first.
bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -R

# Split with mnemonic keys and inherit the active pane's working directory.
bind v split-window -h -c '#{pane_current_path}'
bind h split-window -v -c '#{pane_current_path}'

# Match vi visual selection, rectangular selection, and yank behavior.
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Reload this file without restarting the tmux server.
bind r source-file ~/.tmux.conf \; display-message 'Reloaded ~/.tmux.conf'
